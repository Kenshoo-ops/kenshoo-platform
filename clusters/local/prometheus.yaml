apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.39.0
    helm:
      valuesObject:
        # Server-only and ephemeral: the k3d node has about 1.3 GiB of headroom,
        # so no alertmanager, kube-state-metrics, node-exporter or pushgateway.
        # Re-evaluate on the OCI server (persistent volume, longer retention).
        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        configmapReload:
          prometheus:
            resources:
              requests: {cpu: 5m, memory: 16Mi}
              limits: {memory: 32Mi}
        server:
          persistentVolume:
            enabled: false
          retention: "6h"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
