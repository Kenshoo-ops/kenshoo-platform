apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kenshoo-ops/kenshoo-platform.git
    targetRevision: main
    path: apps/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # On a fresh cluster the Kyverno CRDs may not exist yet when this syncs.
      - SkipDryRunOnMissingResource=true
