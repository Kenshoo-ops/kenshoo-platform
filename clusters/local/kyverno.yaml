apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.2
    helm:
      valuesObject:
        # Only the admission controller is needed to verify signatures at deploy time.
        # Reports stay on so audit-mode results are visible. Re-evaluate on the OCI server.
        backgroundController:
          enabled: false
        cleanupController:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno's CRDs are too large for client-side apply ("annotation too long").
      - ServerSideApply=true
  # The API server never stores the empty annotations/labels maps that the
  # rendered Kyverno CRDs carry, so Argo CD reports them as drift forever.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.annotations
        - .metadata.labels
